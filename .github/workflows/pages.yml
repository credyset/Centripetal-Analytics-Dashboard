name: Publish dashboard to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out shared project
        uses: actions/checkout@v6
      - name: Validate reporting snapshot
        run: python3 tools/check_shared_snapshot.py
      - name: Check dashboard JavaScript
        run: node --check app.js
      - name: Check commercial outcome and coverage rules
        run: node tools/check_outcome_metrics.js
      - name: Check newer source and publication hold preservation
        run: python3 tools/check_snapshot_preservation.py
      - name: Build approved static dashboard
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 tools/build_static_site.py
          else
            python3 tools/build_static_site.py --for-publication
          fi
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Publish dashboard
        id: deployment
        uses: actions/deploy-pages@v4
